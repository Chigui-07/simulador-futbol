<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Chigui World Cup</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#edf5ff;background:#071426}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -5%,#203e65 0,transparent 45%),#071426;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.38}.app{max-width:1320px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:24px}.brand{font-weight:900;font-size:25px;letter-spacing:-.8px}.brand span{color:#56d8b3}.pill{border:1px solid #315170;border-radius:50px;padding:8px 14px;background:#0c2037;color:#bdd2e8;font-size:13px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.nav{display:grid;gap:10px;align-content:start}.nav button{padding:14px 15px;text-align:left;border-radius:12px;background:#10243c;color:#b7d2ed;border:1px solid #28425e}.nav button.active{background:#175a60;border-color:#31c7a1;color:white}.panel{background:#10243bdc;border:1px solid #2b4965;border-radius:18px;padding:24px;margin-bottom:18px}.hero{background:linear-gradient(110deg,#123c50,#184268 55%,#17324e);padding:36px;border-radius:20px;border:1px solid #356274;margin-bottom:20px}.hero h1{font-size:clamp(28px,4vw,48px);margin:10px 0}.muted{color:#a6bfd5}.small{font-size:12px}.btn{background:#31d3aa;color:#052b2a;padding:12px 18px;border-radius:10px;font-weight:800}.btn.secondary{background:#243e59;color:#edf5ff}.btn.danger{background:#74364b;color:#fff}.btn.selected{background:#1d736b;color:white}.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px}.card{background:#132d47;border:1px solid #315372;border-radius:13px;padding:14px}.card.pick{cursor:pointer}.card.pick.chosen{border-color:#37d9af;background:#184b4f}.flag{width:45px;height:30px;object-fit:cover;border-radius:3px;background:#25435a;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0}.flagfallback{font-size:24px}.team{display:flex;gap:10px;align-items:center;min-width:0}.teamname{font-weight:650;font-size:13px;word-break:break-word}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:165px}.field input,.field select{width:100%;padding:12px;background:#091b2e;color:white;border:1px solid #40617b;border-radius:9px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:15px 0}.counter{color:#4be1b5;font-weight:800}.groupgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.groupitem{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #2b4760}.matches{display:grid;gap:10px}.match{background:#122e49;border:1px solid #315471;border-radius:12px;padding:14px}.matchline{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.score{font-size:25px;font-weight:900;white-space:nowrap}.right{text-align:right}.results{color:#5de5bb;font-size:12px}.statbar{height:9px;border-radius:9px;background:#29455e;overflow:hidden;margin-top:9px}.statbar>div{height:100%;background:#37d7aa}.hidden{display:none!important}h2{margin:0 0 12px}h3{margin:0 0 10px}p{line-height:1.6}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #29465e}th{color:#9db9d3}td.num,th.num{text-align:center} .badge{font-size:11px;background:#234a58;color:#7ff1cb;border-radius:40px;padding:4px 9px}.empty{padding:45px 20px;text-align:center;color:#9fb9d1}.toast{position:fixed;right:20px;bottom:20px;background:#164c48;color:white;padding:14px 20px;border-radius:12px;max-width:85%;z-index:5;box-shadow:0 12px 32px #0007}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.event{border-left:2px solid #3bbf9b;padding:7px 12px;margin:8px 0;color:#cce2f5}.selectbox{display:flex;justify-content:space-between;gap:8px;align-items:center}.foot{font-size:12px;color:#8eabc4;padding:30px 0;text-align:center}@media(max-width:800px){.app{padding:12px}.layout{grid-template-columns:1fr}.nav{display:flex;overflow-x:auto}.nav button{flex-shrink:0}.panel{padding:16px}.hero{padding:22px}.matchline{gap:5px}.score{font-size:20px}.brand{font-size:21px}}

<body><div class="app"><header class="header"><div class="brand">🏆 CHIGUI <span>WORLD CUP</span></div><div class="pill">⚽ Simulador web · v0.1</div></header>
<div class="layout"><nav class="nav" id="nav"><button class="active" data-page="home">🏠 Inicio</button><button data-page="create">🏆 Nueva copa</button><button data-page="cup">⚽ Mi Mundial</button><button data-page="history">📜 Campeones</button><button data-page="about">⚙️ Opciones</button></nav><main id="main"></main></div>
<footer class="foot">Chigui World Cup — Simulación ficticia de selecciones, sin apuestas con dinero real.</footer></div>
<script src="countries.js"></script><script src="flags.js"></script><script>
"use strict";
const KEY="cwc_v01", HIS="cwc_history_v01", SETTINGS="cwc_settings";
const popular="ARGENTINA|BRASIL|ALEMANIA|FRANCIA|ESPAÑA|INGLATERRA|PORTUGAL|ITALIA|PAISES BAJOS|CROACIA|JAPON|COREA DEL SUR|MEXICO|ESTADOS UNIDOS|URUGUAY|MARRUECOS|SENEGAL|NIGERIA|BELGICA|SUIZA|COLOMBIA|ECUADOR|AUSTRALIA|DINAMARCA|SUECIA|POLONIA|CANADA|GUATEMALA|CHILE|PERU|COSTA RICA|GHANA".split("|");
for(const c of COUNTRIES){let n=0;for(const x of c.name)n=(n*31+x.charCodeAt(0))>>>0;c.strength=Math.max(30,Math.min(94,43+(n%29)+(popular.includes(c.name)?17:0)));} 
const byId=Object.fromEntries(COUNTRIES.map(c=>[c.id,c]));
let cup=null,history=[],settings={speed:2},page="home",search="",continent="TODOS",selected=new Set(),cupName="Copa del Mundo Chigui",cupSize=16;
function load(){try{cup=JSON.parse(localStorage.getItem(KEY)||"null");history=JSON.parse(localStorage.getItem(HIS)||"[]");settings={speed:2,...JSON.parse(localStorage.getItem(SETTINGS)||"{}")};}catch(e){console.warn(e);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cup));localStorage.setItem(HIS,JSON.stringify(history));localStorage.setItem(SETTINGS,JSON.stringify(settings));}catch(e){toast("No se pudo guardar en este navegador.");}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const flagCodes={"ALEMANIA":"DE","ARGENTINA":"AR","BRASIL":"BR","FRANCIA":"FR","ESPAÑA":"ES","INGLATERRA":"GB","PORTUGAL":"PT","ITALIA":"IT","PAISES BAJOS":"NL","CROACIA":"HR","JAPON":"JP","COREA DEL SUR":"KR","MEXICO":"MX","ESTADOS UNIDOS":"US","URUGUAY":"UY","MARRUECOS":"MA","SENEGAL":"SN","NIGERIA":"NG","BELGICA":"BE","SUIZA":"CH","COLOMBIA":"CO","ECUADOR":"EC","AUSTRALIA":"AU","DINAMARCA":"DK","SUECIA":"SE","POLONIA":"PL","CANADA":"CA","GUATEMALA":"GT","CHILE":"CL","PERU":"PE","COSTA RICA":"CR","GHANA":"GH","CHINA":"CN","INDIA":"IN","INDONESIA":"ID","EGIPTO":"EG","TUNEZ":"TN","KENIA":"KE","SUDAFRICA":"ZA","NUEVA ZELANDA":"NZ","PANAMA":"PA","PARAGUAY":"PY","VENEZUELA":"VE","HONDURAS":"HN","EL SALVADOR":"SV","NICARAGUA":"NI","CUBA":"CU","JAMAICA":"JM","CHIPRE":"CY","GRECIA":"GR","TURQUIA":"TR","RUSIA":"RU","UCRANIA":"UA","NORUEGA":"NO","FINLANDIA":"FI","ISLANDIA":"IS","IRLANDA":"IE","AUSTRIA":"AT","HUNGRIA":"HU","CHEQUIA":"CZ","ESLOVAQUIA":"SK","ESLOVENIA":"SI","SERBIA":"RS","BULGARIA":"BG","RUMANIA":"RO","ALBANIA":"AL","GEORGIA":"GE","PAKISTAN":"PK","TAILANDIA":"TH","VIETNAM":"VN","FILIPINAS":"PH","MALASIA":"MY","SINGAPUR":"SG","ARABIA SAUDITA":"SA","CATAR":"QA","EMIRATOS ARABES UNIDOS":"AE","CAMERUN":"CM","COSTA DE MARFIL":"CI","ZAMBIA":"ZM","ANGOLA":"AO","PUERTO RICO":"PR"};function fallbackFlag(c){let code=flagCodes[c.name];return code?String.fromCodePoint(...[...code].map(x=>127397+x.charCodeAt(0))):"🌐";}
function flag(c){if(!c)return '🏳️';const remote=flagRemoteSource(c);const source=remote||('flags/'+encodeURIComponent(c.continent)+'/'+encodeURIComponent(c.name)+'.png');const fallback=esc(fallbackFlag(c));return '<img class="flag" alt="Bandera de '+esc(c.name)+'" loading="lazy" src="'+source+'" data-fallback="'+fallback+'" onerror="this.outerHTML=this.dataset.fallback">';}
function team(id){const c=byId[id];return c?'<span class="team">'+flag(c)+'<span class="teamname">'+esc(c.name)+'</span></span>':'—';}
function toast(s){document.querySelector(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),3200);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function navigate(p){page=p;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));render();window.scrollTo(0,0);}
document.querySelectorAll(".nav button").forEach(x=>x.addEventListener("click",()=>navigate(x.dataset.page)));
function render(){const root=document.getElementById("main");root.innerHTML=({home:renderHome,create:renderCreate,cup:renderCup,history:renderHistory,about:renderAbout}[page])();}
function renderHome(){return '<div class="hero"><div class="badge">🏆 TU PROPIO MUNDIAL</div><h1>La gloria empieza aquí.</h1><p>Crea copas con países y territorios, sortea grupos y vive partidos llenos de sorpresas.</p><div class="btnrow"><button class="btn" onclick="navigate(\'create\')">＋ Crear nueva copa</button><button class="btn secondary" onclick="navigate(\'cup\')">Ver mi Mundial</button></div></div><div class="grid"><div class="card"><h2>'+COUNTRIES.length+'</h2><p class="muted">Participantes disponibles</p></div><div class="card"><h2>'+(cup?esc(cup.name):"—")+'</h2><p class="muted">Copa actual</p></div><div class="card"><h2>'+history.length+'</h2><p class="muted">Campeones guardados</p></div></div><div class="panel" style="margin-top:20px"><h3>🚧 Próximamente</h3><p>Salas online con amigos, perfiles, pronósticos con Chiguicoins, rankings y logros. Esta versión permite jugar y guardar torneos en este navegador.</p></div>';}
function renderCreate(){const list=COUNTRIES.filter(c=>(continent==="TODOS"||c.continent===continent)&&c.name.toLocaleLowerCase().includes(search.toLocaleLowerCase()));return '<section class="panel"><h2>🏆 Crear copa personalizada</h2><p class="muted">Elige el tamaño, personaliza el nombre y selecciona exactamente las selecciones que participarán.</p><div class="toolbar"><label class="field">Nombre de la copa<input id="cupname" maxlength="55" value="'+esc(cupName)+'"></label><label class="field">Participantes<select id="cupsize">'+[8,16,24,32,48,64].map(n=>'<option '+(cupSize===n?'selected':'')+'>'+n+'</option>').join("")+'</select></label></div><div class="btnrow"><button class="btn secondary" id="randompick">🎲 Selección aleatoria</button><button class="btn secondary" id="clearpick">Limpiar</button><span class="counter">'+selected.size+'/'+cupSize+' elegidos</span><button class="btn" id="startcup" '+(selected.size!==cupSize?"disabled":"")+'>Crear y sortear →</button></div></section><section class="panel"><div class="sectiontitle"><h2>🌎 Participantes ('+list.length+')</h2></div><div class="toolbar"><label class="field">Buscar<input id="search" placeholder="Ej. Guatemala, Japón..." value="'+esc(search)+'"></label><label class="field">Continente<select id="continent">'+["TODOS","AFRICA","AMERICA","ASIA","EUROPA","OCEANIA"].map(c=>'<option '+(continent===c?"selected":"")+'>'+c+'</option>').join("")+'</select></label></div><div class="grid">'+list.map(c=>'<button class="card pick '+(selected.has(c.id)?"chosen":"")+'" data-pick="'+esc(c.id)+'"><div class="selectbox">'+team(c.id)+'<span>'+(selected.has(c.id)?"✓":"＋")+'</span></div><div class="small muted" style="margin-top:8px">Fuerza: '+c.strength+'/100</div><div class="statbar"><div style="width:'+c.strength+'%"></div></div></button>').join("")+'</div></section>';}
document.getElementById("main").addEventListener("input",e=>{if(e.target.id==="search"){search=e.target.value;const start=e.target.selectionStart;render();const i=document.getElementById("search");i.focus();i.setSelectionRange(start,start);}if(e.target.id==="cupname")cupName=e.target.value;});
document.getElementById("main").addEventListener("change",e=>{if(e.target.id==="cupsize"){cupSize=+e.target.value;selected=new Set([...selected].slice(0,cupSize));render();}if(e.target.id==="continent"){continent=e.target.value;render();}if(e.target.id==="speed"){settings.speed=+e.target.value;save();render();}});
document.getElementById("main").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.pick){const id=b.dataset.pick;if(selected.has(id))selected.delete(id);else if(selected.size<cupSize)selected.add(id);else toast("Ya seleccionaste "+cupSize+" participantes.");render();}if(b.id==="randompick"){selected=new Set(shuffle(COUNTRIES).slice(0,cupSize).map(c=>c.id));render();}if(b.id==="clearpick"){selected.clear();render();}if(b.id==="startcup"){startCup();}if(b.id==="playnext")playNext();if(b.id==="playall")playAll();if(b.id==="resetcup")resetCup();if(b.id==="deletehistory"){if(confirm("¿Borrar todo el historial de campeones?")){history=[];save();render();}}});
function startCup(){if(selected.size!==cupSize)return toast("Selecciona exactamente "+cupSize+" equipos.");if(cup&&!cup.champion&&!confirm("Hay una copa en curso. ¿Reemplazarla?"))return;const teams=shuffle([...selected]);const count=cupSize===24?6:cupSize===48?12:cupSize/4;const groups=Array.from({length:count},(_,i)=>({name:String.fromCharCode(65+i),teams:teams.slice(i*4,i*4+4)}));const games=[];for(const g of groups){for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)games.push({a:g.teams[i],b:g.teams[j],group:g.name,stage:"Grupos",played:false});}cup={id:Date.now(),name:cupName.trim()||"Copa Chigui",size:cupSize,groups,games,phase:"groups",round:0,champion:null,events:[]};save();navigate("cup");toast("¡Sorteo completado!");}
function sortedGroup(g){const s=g.teams.map(id=>({id,p:0,pj:0,gf:0,gc:0,dg:0}));for(const m of cup.games.filter(m=>m.group===g.name&&m.played)){for(const [id,gf,gc] of [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]]){let t=s.find(t=>t.id===id);t.pj++;t.gf+=gf;t.gc+=gc;t.dg+=gf-gc;t.p+=gf>gc?3:gf===gc?1:0;}}return s.sort((a,b)=>b.p-a.p||b.dg-a.dg||b.gf-a.gf||byId[a.id].name.localeCompare(byId[b.id].name));}
function renderCup(){if(!cup)return '<div class="panel empty"><h2>⚽ Aún no tienes un Mundial</h2><p>Crea tu primera copa y el sorteo aparecerá aquí.</p><button class="btn" onclick="navigate(\'create\')">Crear copa</button></div>';const pending=cup.games.filter(m=>!m.played);let out='<div class="panel"><div class="sectiontitle"><div><div class="badge">🏆 '+(cup.champion?"FINALIZADO":esc(cup.phase==="groups"?"FASE DE GRUPOS":"ELIMINATORIAS"))+'</div><h2 style="margin-top:10px">'+esc(cup.name)+'</h2><p class="muted">'+cup.size+' selecciones · '+cup.games.filter(x=>x.played).length+'/'+cup.games.length+' partidos</p></div><div class="btnrow"><button class="btn secondary" id="resetcup">Nueva copa</button></div></div>'+(cup.champion?'<h2 style="color:#61e3b7">🥇 Campeón: '+esc(byId[cup.champion].name)+'</h2>':'<div class="btnrow"><button class="btn" id="playnext">▶ Simular siguiente</button><button class="btn secondary" id="playall">⏩ Completar fase</button></div>')+'</div>';
if(cup.phase==="groups"){out+='<section class="panel"><h2>📊 Clasificación de grupos</h2><div class="groupgrid">'+cup.groups.map(g=>'<div class="card"><h3>Grupo '+g.name+'</h3><table><thead><tr><th>Equipo</th><th class="num">PJ</th><th class="num">DG</th><th class="num">PTS</th></tr></thead><tbody>'+sortedGroup(g).map((t,i)=>'<tr><td><span style="color:'+(i<2?"#5aebbd":"inherit")+'">'+(i+1)+'. '+esc(byId[t.id].name)+'</span></td><td class="num">'+t.pj+'</td><td class="num">'+t.dg+'</td><td class="num">'+t.p+'</td></tr>').join("")+'</tbody></table></div>').join("")+'</div></section>';}
out+='<section class="panel"><div class="sectiontitle"><h2>⚽ Partidos</h2><span class="muted small">'+pending.length+' pendientes</span></div><div class="matches">'+cup.games.slice(-60).map(m=>'<div class="match"><div class="small muted">'+esc(m.group?"Grupo "+m.group:m.stage)+'</div><div class="matchline"><div>'+team(m.a)+'</div><div class="score">'+(m.played?m.sa+" : "+m.sb:"vs")+'</div><div class="right">'+team(m.b)+'</div></div>'+(m.penalties?'<div class="results">Penaltis: '+m.penalties.join(" - ")+'</div>':"")+(m.played&&m.events?.length?'<details><summary class="small muted">Ver eventos</summary>'+m.events.map(x=>'<div class="event">'+esc(x)+'</div>').join("")+'</details>':"")+'</div>').join("")+'</div></section>';return out;}
function simulate(m){const a=byId[m.a],b=byId[m.b];const meanA=Math.max(.28,1.15+(a.strength-b.strength)*.032),meanB=Math.max(.28,1.15+(b.strength-a.strength)*.032);function poisson(lambda){let p=1,n=0;do{n++;p*=Math.random()}while(p>Math.exp(-lambda)&&n<15);return n-1}m.sa=poisson(meanA);m.sb=poisson(meanB);m.events=[];for(let i=0;i<m.sa;i++)m.events.push((1+Math.floor(Math.random()*90))+"' ⚽ Gol de "+a.name);for(let i=0;i<m.sb;i++)m.events.push((1+Math.floor(Math.random()*90))+"' ⚽ Gol de "+b.name);if(m.stage!=="Grupos"&&m.sa===m.sb){let extraA=Math.random()<.24?1:0,extraB=Math.random()<.24?1:0;m.sa+=extraA;m.sb+=extraB;if(extraA)m.events.push("Prórroga ⚽ "+a.name);if(extraB)m.events.push("Prórroga ⚽ "+b.name);if(m.sa===m.sb){let pa=3+Math.floor(Math.random()*3),pb=3+Math.floor(Math.random()*3);if(pa===pb)Math.random()<.5?pa++:pb++;m.penalties=[pa,pb];}}m.events.sort((x,y)=>parseInt(x)-parseInt(y));m.played=true;return m;}
function winner(m){return m.sa>m.sb?m.a:m.sb>m.sa?m.b:(m.penalties?.[0]>m.penalties?.[1]?m.a:m.b);}
function advance(){if(cup.games.some(m=>!m.played))return;if(cup.phase==="groups"){let q=cup.groups.flatMap(g=>sortedGroup(g).slice(0,2).map(x=>x.id));if(cup.size===24){let thirds=cup.groups.map(g=>sortedGroup(g)[2]).sort((a,b)=>b.p-a.p||b.dg-a.dg||b.gf-a.gf);q.push(...thirds.slice(0,4).map(x=>x.id));}else if(cup.size===48){let thirds=cup.groups.map(g=>sortedGroup(g)[2]).sort((a,b)=>b.p-a.p||b.dg-a.dg||b.gf-a.gf);q.push(...thirds.slice(0,8).map(x=>x.id));}q=shuffle(q);cup.phase="knockout";cup.round=1;makeKnockout(q);return;}const previous=cup.games.filter(m=>m.stage!=="Grupos");const maxStage=Math.max(...previous.map(m=>m.round));const last=previous.filter(m=>m.round===maxStage);const winners=last.map(winner);if(winners.length===1){cup.champion=winners[0];history.unshift({name:cup.name,size:cup.size,champion:cup.champion,date:new Date().toLocaleDateString("es-ES")});toast("🏆 ¡Tenemos un campeón!");return;}cup.round++;makeKnockout(winners);}
function makeKnockout(ids){const stage=ids.length===2?"Final":ids.length===4?"Semifinales":ids.length===8?"Cuartos de final":"Ronda de "+ids.length;for(let i=0;i<ids.length;i+=2)cup.games.push({a:ids[i],b:ids[i+1],stage,round:cup.round,played:false});}
function playNext(){if(!cup||cup.champion)return;let m=cup.games.find(x=>!x.played);if(!m){advance();m=cup.games.find(x=>!x.played);}if(!m)return;simulate(m);advance();save();render();toast(byId[m.a].name+" "+m.sa+" - "+m.sb+" "+byId[m.b].name);}
function playAll(){if(!cup||cup.champion)return;const phase=cup.phase,round=cup.round;while(!cup.champion&&cup.phase===phase&&cup.round===round){const m=cup.games.find(x=>!x.played);if(!m)break;simulate(m);advance();}save();render();toast("Fase simulada.");}
function resetCup(){if(!cup||confirm("¿Abandonar la copa actual? El progreso sin terminar se perderá.")){cup=null;save();navigate("create");}}
function renderHistory(){return '<section class="panel"><div class="sectiontitle"><h2>📜 Historia de campeones</h2><button class="btn danger" id="deletehistory" '+(!history.length?"disabled":"")+'>Borrar historial</button></div>'+(history.length?history.map((h,i)=>'<div class="card" style="margin:10px 0"><span class="badge">#'+(history.length-i)+'</span> <strong>'+esc(h.name)+'</strong><p>🥇 '+team(h.champion)+'</p><span class="small muted">'+h.size+' participantes · '+esc(h.date)+'</span></div>').join(""):'<div class="empty">Completa una copa para inaugurar el palmarés.</div>')+'</section>';}
function renderAbout(){return '<section class="panel"><h2>⚙️ Configuración y desarrollo</h2><p>Versión 0.1: simulación local con resultados probabilísticos, grupos, eliminatorias y guardado automático.</p><label class="field" style="max-width:300px">Velocidad de animación (reservada para próximas mejoras)<select id="speed"><option value="1" '+(settings.speed===1?"selected":"")+'>Normal</option><option value="2" '+(settings.speed===2?"selected":"")+'>Rápida</option><option value="4" '+(settings.speed===4?"selected":"")+'>Muy rápida</option></select></label><p class="muted">Las 252 selecciones están en el catálogo. Las banderas se cargarán automáticamente cuando se publiquen los archivos PNG del ZIP dentro de la carpeta flags por continente.</p><h3>En desarrollo</h3><p>Animación en vivo con reloj, pronósticos con Chiguicoins, autenticación, salas privadas, rankings y logros.</p></section>';}
load();render();
</script><script src="extras.js"></script><script src="online.js"></script></body></html>
